<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Problem Mindmaps - Interactive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 2rem);
        }

        .sidebar {
            background: #f8f9fa;
            border-right: 2px solid #e9ecef;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 1.5rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .stats {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            text-align: center;
            flex: 1;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.75rem;
            opacity: 0.9;
        }

        .search-box {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e9ecef;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .problem-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .category {
            margin-bottom: 1rem;
        }

        .category-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .category-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .category-count {
            background: rgba(255, 255, 255, 0.25);
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .category-problems {
            margin-top: 0.5rem;
            display: none;
        }

        .category-problems.expanded {
            display: block;
        }

        .problem-item {
            background: white;
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .problem-item:hover {
            background: #f0f4ff;
            border-left-color: #667eea;
            transform: translateX(4px);
        }

        .problem-item.active {
            background: #e8ecff;
            border-left-color: #667eea;
            font-weight: 600;
        }

        .problem-name {
            font-size: 0.9rem;
            color: #2c3e50;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .problem-header {
            background: white;
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #e9ecef;
        }

        .problem-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .problem-meta {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .problem-category {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #f0f4ff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: #667eea;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .problem-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border: 2px solid #667eea;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .problem-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .expand-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .expand-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .expand-toggle-btn:active {
            transform: translateY(0);
        }

        .mindmap-container {
            flex: 1;
            padding: 2rem;
            overflow: auto;
            background: #fafbfc;
        }

        #mindmap {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            text-align: center;
            padding: 2rem;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-state-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .empty-state-text {
            font-size: 1rem;
            opacity: 0.8;
        }

        .hidden {
            display: none;
        }

        /* Markmap customization */
        .markmap {
            width: 100%;
            height: 100%;
        }

        .markmap-node circle {
            cursor: pointer;
            transition: all 0.3s;
        }

        .markmap-node:hover circle {
            r: 12;
            stroke-width: 3;
        }

        .markmap-link {
            transition: all 0.3s;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        /* Mobile and Tablet Responsive - Collapsible sidebar up to 1024px */
        @media (max-width: 1024px) {
            body {
                padding: 0;
            }

            .container {
                grid-template-columns: 1fr;
                height: 100vh;
                border-radius: 0;
            }

            .sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                width: 85%;
                max-width: 320px;
                height: 100vh;
                z-index: 1000;
                transition: left 0.3s ease;
                border-right: none;
                box-shadow: 5px 0 20px rgba(0, 0, 0, 0.3);
            }

            .sidebar.open {
                left: 0;
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 999;
            }

            .sidebar-overlay.open {
                display: block;
            }

            .mobile-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 0.5rem 1rem;
                gap: 0.5rem;
                min-height: 48px;
            }

            .mobile-header h1 {
                font-size: 1rem;
                flex-shrink: 1;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                margin: 0;
            }

            .mobile-stats {
                display: flex;
                gap: 0.5rem;
                flex-shrink: 0;
            }

            .mobile-stat {
                background: rgba(255, 255, 255, 0.2);
                padding: 0.2rem 0.5rem;
                border-radius: 6px;
                font-size: 0.65rem;
                white-space: nowrap;
            }

            .hamburger {
                display: flex;
                flex-direction: column;
                gap: 5px;
                cursor: pointer;
                padding: 0.5rem;
                min-width: 44px;
                min-height: 44px;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                border-radius: 8px;
                transition: background 0.2s;
            }

            .hamburger:hover,
            .hamburger:active {
                background: rgba(255, 255, 255, 0.1);
            }

            .hamburger span {
                width: 22px;
                height: 2px;
                background: white;
                border-radius: 2px;
                transition: all 0.3s;
            }

            .header {
                padding: 1.25rem 1rem;
            }

            .header h1 {
                font-size: 1.25rem;
            }

            .header p {
                font-size: 0.85rem;
            }

            .stats {
                gap: 0.5rem;
            }

            .stat {
                padding: 0.4rem 0.5rem;
            }

            .stat-number {
                font-size: 1.2rem;
            }

            .stat-label {
                font-size: 0.7rem;
            }

            .search-box {
                padding: 0.75rem 1rem;
            }

            .search-wrapper {
                position: relative;
                display: flex;
                align-items: center;
            }

            .search-input {
                padding-right: 2.5rem;
                min-height: 44px;
            }

            .search-clear {
                position: absolute;
                right: 0.25rem;
                background: none;
                border: none;
                font-size: 1rem;
                cursor: pointer;
                color: #6c757d;
                padding: 0.5rem;
                min-width: 44px;
                min-height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 6px;
                transition: background 0.2s;
            }

            .search-clear:hover,
            .search-clear:active {
                background: rgba(0, 0, 0, 0.05);
            }

            .problem-item {
                min-height: 44px;
                padding: 0.875rem 1rem;
            }

            .category-header {
                min-height: 48px;
            }

            .problem-header {
                padding: 1rem;
            }

            .problem-title {
                font-size: 1.25rem !important;
                line-height: 1.3;
            }

            .problem-meta {
                flex-direction: column;
                gap: 0.5rem !important;
                align-items: stretch;
            }

            .problem-category,
            .problem-link,
            .expand-toggle-btn {
                font-size: 0.85rem !important;
                padding: 0.5rem 0.875rem !important;
                min-height: 44px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .mindmap-container {
                padding: 0.5rem;
                touch-action: manipulation;
            }

            #mindmap {
                border-radius: 10px;
                touch-action: pan-x pan-y pinch-zoom;
            }

            .close-sidebar {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                top: 0.75rem;
                right: 0.75rem;
                font-size: 1.25rem;
                cursor: pointer;
                color: white;
                z-index: 10;
                min-width: 44px;
                min-height: 44px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 8px;
                transition: background 0.2s;
            }

            .close-sidebar:hover,
            .close-sidebar:active {
                background: rgba(255, 255, 255, 0.2);
            }
        }

        /* Landscape orientation on mobile */
        @media (max-width: 896px) and (orientation: landscape) {
            .mobile-header {
                padding: 0.5rem 1rem;
            }

            .mobile-header h1 {
                font-size: 1rem;
            }

            .header {
                padding: 0.75rem 1rem;
            }

            .header h1 {
                font-size: 1.1rem;
            }

            .header p {
                display: none;
            }

            .stats {
                flex-direction: row;
                gap: 0.5rem;
                margin-top: 0.5rem;
            }

            .stat {
                padding: 0.3rem 0.5rem;
            }

            .stat-number {
                font-size: 1rem;
            }

            .stat-label {
                font-size: 0.65rem;
            }

            .problem-header {
                padding: 0.75rem 1rem;
            }

            .problem-title {
                font-size: 1.1rem !important;
                margin-bottom: 0.25rem;
            }

            .problem-meta {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 0.5rem !important;
            }

            .problem-category,
            .problem-link,
            .expand-toggle-btn {
                min-height: 36px;
                font-size: 0.75rem !important;
                padding: 0.35rem 0.75rem !important;
            }

            .mindmap-container {
                padding: 0.25rem;
            }

            .problem-list {
                max-height: calc(100vh - 140px);
            }
        }

        /* Small mobile devices */
        @media (max-width: 374px) {
            .mobile-header h1 {
                font-size: 1rem;
            }

            .mobile-stats {
                display: none;
            }

            .header h1 {
                font-size: 1.1rem;
            }

            .stats {
                flex-direction: column;
                gap: 0.5rem;
            }

            .stat {
                padding: 0.5rem;
            }

            .problem-meta {
                gap: 0.4rem !important;
            }

            .problem-category,
            .problem-link,
            .expand-toggle-btn {
                font-size: 0.8rem !important;
                width: 100%;
                justify-content: center;
            }
        }



        /* Desktop - hide mobile elements, show permanent sidebar */
        @media (min-width: 1025px) {

            .mobile-header,
            .sidebar-overlay,
            .close-sidebar {
                display: none;
            }

            .search-wrapper {
                position: relative;
                display: flex;
                align-items: center;
            }

            .search-clear {
                position: absolute;
                right: 0.5rem;
                background: none;
                border: none;
                font-size: 1rem;
                cursor: pointer;
                color: #6c757d;
                padding: 0.25rem 0.5rem;
                border-radius: 4px;
                transition: background 0.2s;
            }

            .search-clear:hover {
                background: rgba(0, 0, 0, 0.05);
            }
        }

        /* Focus visible for accessibility */
        .problem-item:focus-visible,
        .category-header:focus-visible,
        .hamburger:focus-visible,
        .close-sidebar:focus-visible,
        .expand-toggle-btn:focus-visible,
        .problem-link:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
        }

        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .sidebar {
                transition: none;
            }
        }

        /* Mobile hint toast */
        .mobile-hint {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 1001;
            white-space: nowrap;
            animation: fadeInOut 4s ease-in-out forwards;
        }

        @keyframes fadeInOut {

            0%,
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            15%,
            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Mobile Header -->
        <div class="mobile-header">
            <h1>🧠 LeetCode Mindmaps</h1>
            <div class="mobile-stats">
                <span class="mobile-stat" id="mobile-problem-count">107 problems</span>
            </div>
            <div class="hamburger" onclick="toggleSidebar()" role="button" aria-label="Open navigation menu"
                tabindex="0">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Overlay for mobile -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <div class="sidebar" id="sidebar">
            <button class="close-sidebar" onclick="toggleSidebar()" aria-label="Close navigation menu"
                tabindex="0">✕</button>
            <div class="header">
                <h1>🧠 LeetCode Mindmaps</h1>
                <p>Click nodes to expand/collapse</p>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number" id="total-problems">107</div>
                        <div class="stat-label">Problems</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="total-categories">8</div>
                        <div class="stat-label">Categories</div>
                    </div>
                </div>
            </div>

            <div class="search-box">
                <div class="search-wrapper">
                    <input type="text" id="search" class="search-input" placeholder="🔍 Search problems..."
                        aria-label="Search problems">
                    <button class="search-clear hidden" id="search-clear" onclick="clearSearch()"
                        aria-label="Clear search">✕</button>
                </div>
            </div>

            <div class="problem-list" id="problem-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading problems...</p>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="problem-header" id="problem-header" style="display: none;">
                <div class="problem-title" id="current-problem-title"></div>
                <div class="problem-meta">
                    <div class="problem-category" id="current-problem-category"></div>
                    <a href="#" id="current-problem-link" class="problem-link" target="_blank">
                        🔗 View on LeetCode
                    </a>
                    <button id="expand-toggle" class="expand-toggle-btn" onclick="toggleExpandAll()">
                        📖 Expand All
                    </button>
                </div>
            </div>

            <div class="mindmap-container">
                <div class="empty-state" id="empty-state">
                    <div class="empty-state-icon">🧠</div>
                    <div class="empty-state-title">Select a Problem</div>
                    <div class="empty-state-text">Choose a problem from the sidebar to view its interactive mindmap
                    </div>
                </div>
                <svg id="mindmap" class="hidden"></svg>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>

    <script>
        let problemsData = null;
        let currentMarkmap = null;
        let currentExpanded = false;
        let currentRootData = null;

        // Mobile sidebar toggle with body scroll lock
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');

            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');

            // Prevent body scroll when sidebar is open
            if (sidebar.classList.contains('open')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }

        // Touch gesture handling for sidebar swipe
        let touchStartX = 0;
        let touchEndX = 0;

        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
        }

        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }

        function handleSwipe() {
            const swipeThreshold = 50;
            const sidebarOpen = document.getElementById('sidebar').classList.contains('open');

            // Swipe right to open (from left edge only)
            if (!sidebarOpen && touchStartX < 30 && touchEndX - touchStartX > swipeThreshold) {
                toggleSidebar();
            }

            // Swipe left to close
            if (sidebarOpen && touchStartX - touchEndX > swipeThreshold) {
                toggleSidebar();
            }
        }

        // Add touch event listeners
        document.addEventListener('touchstart', handleTouchStart, { passive: true });
        document.addEventListener('touchend', handleTouchEnd, { passive: true });

        // Keyboard support for hamburger menu
        document.querySelector('.hamburger')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleSidebar();
            }
        });

        // Show mobile hint on first mindmap load
        function showMobileHint() {
            if (window.innerWidth <= 768 && !localStorage.getItem('mindmapHintShown')) {
                const hint = document.createElement('div');
                hint.className = 'mobile-hint';
                hint.innerHTML = '👆 Pinch to zoom • Tap nodes to expand';
                document.body.appendChild(hint);

                setTimeout(() => hint.remove(), 4000);
                localStorage.setItem('mindmapHintShown', 'true');
            }
        }

        // Search clear functionality
        function clearSearch() {
            const searchInput = document.getElementById('search');
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
            searchInput.focus();
        }

        function updateSearchClearVisibility() {
            const searchInput = document.getElementById('search');
            const clearBtn = document.getElementById('search-clear');
            if (searchInput.value.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        // Load problems data
        async function loadProblems() {
            try {
                const response = await fetch('leetcode_problems.json');
                problemsData = await response.json();
                renderProblemList(problemsData);

                // Update stats
                document.getElementById('total-problems').textContent = problemsData.length;
                document.getElementById('mobile-problem-count').textContent = `${problemsData.length} problems`;

                const categories = Object.keys(groupByCategory(problemsData));
                document.getElementById('total-categories').textContent = categories.length;
            } catch (error) {
                document.getElementById('problem-list').innerHTML = `
                    <div style="padding: 1rem; color: #dc3545; text-align: center;">
                        Error loading problems
                    </div>
                `;
            }
        }

        // Group problems by category
        function groupByCategory(problems) {
            const grouped = {};
            problems.forEach(problem => {
                const category = problem.context.sheet;
                if (!grouped[category]) {
                    grouped[category] = [];
                }
                grouped[category].push(problem);
            });
            return grouped;
        }

        // Get problem slug from URL
        function getProblemSlug(url) {
            const match = url.match(/\/problems\/([\w-]+)\/?/);
            return match ? match[1] : null;
        }

        // Convert slug to title
        function slugToTitle(slug) {
            return slug.split('-').map(word =>
                word.charAt(0).toUpperCase() + word.slice(1)
            ).join(' ');
        }

        // Get category icon
        function getCategoryIcon(category) {
            const icons = {
                'Google tagged': '🏢',
                'Arrays & Strings': '📊',
                'Hashmaps': '🗺️',
                'Linked Lists': '🔗',
                'Stacks & Queues': '📚',
                'Graphs & Trees': '🌳',
                'Heaps': '⛰️',
                'Recursion & DP': '🔄'
            };
            return icons[category] || '📝';
        }

        // Render problem list with accessibility
        function renderProblemList(problems) {
            const grouped = groupByCategory(problems);
            const categories = Object.keys(grouped).sort();

            let html = '';
            categories.forEach((category, catIndex) => {
                const categoryProblems = grouped[category];
                const categoryId = `category-${catIndex}`;

                html += `
                    <div class="category">
                        <div class="category-header" onclick="toggleCategory('${categoryId}')" role="button" tabindex="0" aria-expanded="false" aria-controls="${categoryId}">
                            <span>${getCategoryIcon(category)} ${category}</span>
                            <span class="category-count">${categoryProblems.length}</span>
                        </div>
                        <div class="category-problems" id="${categoryId}" role="region">
                `;

                categoryProblems.forEach((problem) => {
                    const slug = getProblemSlug(problem.url);
                    const title = slugToTitle(slug);

                    html += `
                        <div class="problem-item" onclick='selectProblem(${JSON.stringify(problem)})' role="button" tabindex="0">
                            <div class="problem-name">${title}</div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            document.getElementById('problem-list').innerHTML = html;

            // Add keyboard navigation for problem items
            document.querySelectorAll('.problem-item, .category-header').forEach(item => {
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        item.click();
                    }
                });
            });
        }

        // Toggle category with accessibility update
        function toggleCategory(categoryId) {
            const element = document.getElementById(categoryId);
            const header = element.previousElementSibling;
            const isExpanding = !element.classList.contains('expanded');

            element.classList.toggle('expanded');
            header.setAttribute('aria-expanded', isExpanding);
        }

        // Select problem and render mindmap
        function selectProblem(problem) {
            const slug = getProblemSlug(problem.url);
            const title = slugToTitle(slug);
            const category = problem.context.sheet;

            // Update header
            document.getElementById('problem-header').style.display = 'block';
            document.getElementById('current-problem-title').textContent = title;
            document.getElementById('current-problem-category').innerHTML = `${getCategoryIcon(category)} ${category}`;
            document.getElementById('current-problem-link').href = problem.url;

            // Hide empty state, show mindmap
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('mindmap').classList.remove('hidden');

            // Highlight selected problem
            document.querySelectorAll('.problem-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.problem-item').classList.add('active');

            // Render mindmap
            renderMindmap(title, problem);

            // Close sidebar on mobile and restore body scroll
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        // Create mindmap markdown content (FALLBACK ONLY)
        function createMindmapMarkdown(title) {
            return `# ${title}

Mindmap file not found. 

Please ensure the markdown file exists in the correct category folder.`;
        }

        // Fetch markdown content from file
        async function fetchMindmapContent(problem) {
            const slug = getProblemSlug(problem.url);
            const categoryDir = problem.context.sheet.toLowerCase().replace(/[^\w\s-]/g, '').replace(/[\s-]+/g, '_');
            const path = `leetcode_mindmaps/${categoryDir}/${slug}.md`;

            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error('File not found');
                return await response.text();
            } catch (error) {
                console.warn(`Could not load mindmap from ${path}, using fallback`);
                return null;
            }
        }

        // Render Markmap
        async function renderMindmap(title, problem) {
            try {
                // Try to fetch specific content first
                let markdown = await fetchMindmapContent(problem);

                // If fetch failed, fallback to generic
                if (!markdown) {
                    markdown = createMindmapMarkdown(title);
                }

                // Create transformer
                const transformer = new markmap.Transformer();

                // Transform markdown to markmap data
                const { root, features } = transformer.transform(markdown);

                const svg = d3.select('#mindmap');
                svg.selectAll('*').remove(); // Clear previous

                // Load assets if needed
                const { styles, scripts } = transformer.getUsedAssets(features);
                if (styles) await markmap.loadCSS(styles);
                if (scripts) await markmap.loadJS(scripts);

                // Save root data for expand/collapse toggle
                currentRootData = root;
                currentExpanded = false;
                document.getElementById('expand-toggle').innerHTML = '📖 Expand All';

                // Create markmap
                currentMarkmap = markmap.Markmap.create(
                    svg.node(),
                    {
                        color: (node) => {
                            const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe'];
                            return colors[node.depth % colors.length];
                        },
                        duration: 500,
                        maxWidth: 300,
                        initialExpandLevel: 1,
                    },
                    root
                );

                // Fit to view
                setTimeout(() => {
                    currentMarkmap.fit();
                }, 100);

                // Show mobile hint on first load
                showMobileHint();
            } catch (error) {
                console.error('Error rendering mindmap:', error);
                document.getElementById('mindmap').innerHTML = `
                    <text x="50%" y="50%" text-anchor="middle" fill="#dc3545">
                        Error rendering mindmap: ${error.message}
                    </text>
                `;
            }
        }

        // Search functionality with clear button visibility
        document.getElementById('search').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            updateSearchClearVisibility();

            document.querySelectorAll('.category').forEach(category => {
                let hasVisibleProblems = false;

                category.querySelectorAll('.problem-item').forEach(problem => {
                    const problemName = problem.textContent.toLowerCase();
                    const matches = problemName.includes(searchTerm);

                    if (matches) {
                        problem.style.display = 'block';
                        hasVisibleProblems = true;
                    } else {
                        problem.style.display = 'none';
                    }
                });

                category.style.display = hasVisibleProblems ? 'block' : 'none';
            });
        });

        // Toggle expand/collapse all nodes
        function toggleExpandAll() {
            if (!currentMarkmap || !currentRootData) return;

            const btn = document.getElementById('expand-toggle');
            currentExpanded = !currentExpanded;

            // Clear and recreate with new expand level
            const svg = d3.select('#mindmap');
            svg.selectAll('*').remove();

            currentMarkmap = markmap.Markmap.create(
                svg.node(),
                {
                    color: (node) => {
                        const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe'];
                        return colors[node.depth % colors.length];
                    },
                    duration: 500,
                    maxWidth: 300,
                    initialExpandLevel: currentExpanded ? 999 : 1,
                },
                currentRootData
            );

            btn.innerHTML = currentExpanded ? '📕 Collapse All' : '📖 Expand All';
            setTimeout(() => currentMarkmap.fit(), 100);
        }

        // Load problems on page load
        loadProblems();
    </script>
</body>

</html>
