# Builds the two images (web, caddy) and publishes them to GHCR on every push to main.
# Each build pushes only its commit tag; `latest` moves for both images together once both
# are built, because pages from one build name asset files that only the same build's Caddy has.
# The server timer (deploy/update.sh) then pulls `latest`.
name: images

on:
  push:
    branches: [main]
    # Only changes that end up in an image trigger a build (and, through the server timer, a deploy).
    paths:
      - Dockerfile
      - Caddyfile
      - package.json
      - bun.lock
      - web/**
      - data/problems.json
      - data/approaches.json
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, caddy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/google-${{ matrix.target }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at this commit for both images
        run: |
          for target in web caddy; do
            image=ghcr.io/${{ github.repository_owner }}/google-$target
            docker buildx imagetools create -t "$image:latest" "$image:${{ github.sha }}"
          done
