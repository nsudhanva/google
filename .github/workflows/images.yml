# Builds the two images (web, caddy) and publishes them to GHCR on every push to main.
# A server then updates with: docker compose pull && docker compose up -d
name: images

on:
  push:
    branches: [main]
    # Only changes that end up in an image trigger a build (and, through the server timer, a deploy).
    paths:
      - Dockerfile
      - Caddyfile
      - package.json
      - bun.lock
      - web/**
      - data/problems.json
      - data/approaches.json
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, caddy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/google-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/google-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
